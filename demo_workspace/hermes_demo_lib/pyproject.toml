[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes_demo_lib"
description = "一个由Hermes工具生成的示例库"
version = "0.1.0"
authors = [
  { name = "Hermes Team" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
